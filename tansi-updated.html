<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--bodyFont);font-size:var(--baseSize);transition:.2s}a{color:inherit}.wrap{width:calc(100% - 28px);max-width:var(--maxWidth);margin:auto}.mono{font-family:var(--monoFont);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.accent{color:var(--accent)}
:root{--accent:#d8ff4f;--bg:#080808;--surface:#101010;--text:#f4f4ef;--muted:#92928d;--line:#292929;--bodyFont:'Arial',sans-serif;--headingFont:'Arial',sans-serif;--monoFont:'IBM Plex Mono',monospace;--baseSize:15px;--maxWidth:1050px;--sectionPad:65px;--radius:15px;--btnRadius:30px;--headingScale:1;--headingTracking:-6px}
header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);z-index:10}.logo{font-family:var(--headingFont);font-size:18px;font-weight:900;letter-spacing:-1px;text-decoration:none}.logo span{color:var(--accent)}header a:last-child{font-size:11px}
.hero{padding:65px 0 70px}.hero h1{font-family:var(--headingFont);font-size:calc(clamp(55px,17vw,100px) * var(--headingScale));line-height:.84;letter-spacing:var(--headingTracking);margin:17px 0 25px}.hero h1 span{color:var(--accent)}.hero p{color:var(--muted);line-height:1.6;font-size:1em;max-width:600px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:25px}.btn{padding:13px 16px;border:1px solid #444;border-radius:var(--btnRadius);font-weight:bold;font-size:12px;color:var(--text);background:transparent;text-decoration:none}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
section{border-top:1px solid var(--line);padding:var(--sectionPad) 0}.heading{margin-bottom:25px}.heading h2{font-family:var(--headingFont);font-size:calc(48px * var(--headingScale));letter-spacing:calc(var(--headingTracking) * .5);line-height:.9;margin:8px 0}.heading p{color:var(--muted);font-size:13px;line-height:1.6}

<section class="hero" style="border-top:0"><div class="mono accent" id="heroKicker">Video Editor / Creative</div><h1 id="heroHeading">I MAKE <span>VIDEOS</span><br>WORTH WATCHING.</h1><p id="heroBio">I turn raw footage, ideas and campaigns into clean, engaging video from long-form to short-form content and podcast clips.</p><div class="buttons"><a class="btn primary" id="heroWorkBtn" href="#work">See my work ↓</a><a class="btn" id="heroContactBtn" href="#contact">Let's work together ↗</a></div></section>
<section id="work"><div class="heading"><div class="mono accent" id="workKicker">SELECTED WORK</div><h2 id="workTitle">PODCAST → TURNED INTO SHORT-FORM</h2><p id="workIntro">I turn long-form podcast conversations into engaging short-form content built for TikTok, Reels, and YouTube Shorts with sharp pacing, captions, b-rolls, and strong hooks.</p></div><div class="filters" id="filters"><button data-filter="all" class="">All</button><button data-filter="short" class="active">Short-form</button><button data-filter="podcast" class="">Podcast</button><button data-filter="ads" class=""></button><button data-filter="ai" class=""></button></div><div class="projects" id="projects"><article class="project"><div class="thumb"><div class="placeholder">YOUR PROJECT THUMBNAIL</div><span class="tag">Short-form</span></div><div class="project-body"><h3>Talking-Head Edit</h3><p>Clean, fast and native to modern social feeds.</p><span class="watch">WATCH PROJECT ↗</span></div></article></div></section>
<section id="about"><div class="heading"><div class="mono accent" id="aboutKicker">02 / About</div><h2 id="aboutTitle">NOT JUST<br>THE CUTS.</h2></div><div class="about" id="aboutBody"><p>I'm Tansi Cyril Zalabaka, a video editor focused on creating content that earns attention instead of simply filling a timeline.</p><p>I work across short-form content, podcast clips, promotional videos, ads, real-estate creative and AI-assisted production. My editing approach combines pacing, storytelling, motion, captions, B-roll and sound design.</p></div></section>
<section><div class="heading"><div class="mono accent" id="servicesKicker">03 / Services</div><h2 id="servicesTitle">WHAT I EDIT.</h2></div><div class="skills" id="skills"><div class="skill">Short-form / Reels / TikTok / Shorts</div><div class="skill">Podcast clips &amp; repurposing</div><div class="skill">Talking-head &amp; educational content</div><div class="skill">UGC &amp; performance creatives</div><div class="skill">Real-estate &amp; promotional videos</div><div class="skill"></div><div class="skill">B-roll &amp; visual storytelling</div><div class="skill">AI-assisted video production</div></div></section>
<section><div class="heading"><div class="mono accent" id="processKicker">04 / Process</div><h2 id="processTitle">FROM RAW<br>TO READY.</h2></div><div class="process" id="process"><div class="step"><b>01</b><h3>Hook</h3><p>Find the strongest opening and remove anything that slows the story.</p></div><div class="step"><b>02</b><h3>Build</h3><p>Shape the narrative with pacing, cuts, B-roll and visual rhythm.</p></div><div class="step"><b>03</b><h3>Polish</h3><p>Captions, motion and sound design make the edit feel complete.</p></div><div class="step"><b>04</b><h3>Deliver</h3><p>Export clean, platform-ready versions.</p></div></div></section>

function input(label,key,val,type='text'){return '<div class="field"><label>'+label+'</label><input data-key="'+key+'" type="'+type+'" value="'+esc(val)+'"></div>'}
function textarea(label,key,val){return '<div class="field"><label>'+label+'</label><textarea data-key="'+key+'">'+esc(val)+'</textarea></div>'}
function contentEditor(){const c=document.getElementById('contentPanel');c.innerHTML='';let html='<div class="edit-card"><h3>BRAND & HERO</h3>'+input('Brand / logo','brand',data.brand)+input('Site title','siteTitle',data.siteTitle||'')+textarea('SEO description','metaDescription',data.metaDescription||'')+input('Email','email',data.email)+input('Instagram URL','instagram',data.instagram||'')+input('LinkedIn URL','linkedin',data.linkedin||'')+input('YouTube URL','youtube',data.youtube||'')+input('WhatsApp link','whatsapp',data.whatsapp||'')+input('Hero kicker','hero.kicker',data.hero.kicker)+input('Hero first line','hero.headingA',data.hero.headingA)+input('Hero highlighted line','hero.headingB',data.hero.headingB)+input('Hero final line','hero.headingC',data.hero.headingC)+textarea('Hero bio','hero.bio',data.hero.bio)+input('Primary button text','hero.workBtn',data.hero.workBtn)+input('Secondary button text','hero.contactBtn',data.hero.contactBtn)+'</div>';
 html+='<div class="edit-card"><h3>SELECTED WORK</h3>'+input('Section label','work.kicker',data.work.kicker)+input('Section title','work.title',data.work.title)+textarea('Section intro','work.intro',data.work.intro);for(const k of ['all','short','podcast','ads','ai'])html+=input('Filter: '+k,'work.filters.'+k,data.work.filters[k]);html+='</div>';
 html+='<div class="edit-card"><h3>ABOUT</h3>'+input('Section label','about.kicker',data.about.kicker)+textarea('Title (HTML allowed)','about.title',data.about.title)+textarea('Paragraph 1','about.paragraphs.0',data.about.paragraphs[0])+textarea('Paragraph 2','about.paragraphs.1',data.about.paragraphs[1])+'</div>';
 html+='<div class="edit-card"><h3>SERVICES</h3>'+input('Section label','services.kicker',data.services.kicker)+textarea('Title (HTML allowed)','services.title',data.services.title);data.services.items.forEach((x,i)=>html+=input('Service '+(i+1),'services.items.'+i,x));html+='<button class="save" id="addService">+ Add service</button></div>';
 html+='<div class="edit-card"><h3>PROCESS</h3>'+input('Section label','process.kicker',data.process.kicker)+textarea('Title (HTML allowed)','process.title',data.process.title);data.process.steps.forEach((s,i)=>{html+='<div class="edit-card"><b>STEP '+(i+1)+'</b>'+input('Number','process.steps.'+i+'.n',s.n)+input('Title','process.steps.'+i+'.title',s.title)+textarea('Description','process.steps.'+i+'.desc',s.desc)+'</div>'});html+='<button class="save" id="addStep">+ Add step</button></div>';
 html+='<div class="edit-card"><h3>CONTACT & FOOTER</h3>'+input('Contact label','contact.kicker',data.contact.kicker)+textarea('Contact headline (HTML allowed)','contact.title',data.contact.title)+textarea('Contact text','contact.text',data.contact.text)+input('Contact button','contact.button',data.contact.button)+input('Footer left','footer.left',data.footer.left)+input('Footer right','footer.right',data.footer.right)+'</div>';c.innerHTML=html;
 c.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{setPath(data,el.dataset.key,el.value);save();render()});document.getElementById('addService').onclick=()=>{data.services.items.push('New service');save();contentEditor();render()};document.getElementById('addStep').onclick=()=>{data.process.steps.push({n:String(data.process.steps.length+1).padStart(2,'0'),title:'New step',desc:'Add a description.'});save();contentEditor();render()}}
function designEditor(){const c=document.getElementById('designPanel'),d=data.design;const colors=[['Accent','accent'],['Background','bg'],['Surface','surface'],['Text','text'],['Muted','muted'],['Lines','line']];let h='<div class="edit-card"><h3>COLORS</h3>';colors.forEach(([l,k])=>h+='<div class="field"><label>'+l+'</label><div class="colorRow"><input data-key="design.'+k+'" value="'+esc(d[k])+'"><input type="color" data-key="design.'+k+'" value="'+esc(d[k])+'"></div></div>');h+='</div><div class="edit-card"><h3>FONTS</h3>'+selectField('Body font','design.bodyFont',d.bodyFont,['Inter','Archivo','DM Sans','Manrope','Space Grotesk','Syne','Bebas Neue','Arial','Georgia','IBM Plex Mono'])+selectField('Heading font','design.headingFont',d.headingFont,['Inter','Archivo','DM Sans','Manrope','Space Grotesk','Syne','Bebas Neue','Arial','Georgia','IBM Plex Mono'])+input('Custom body font (optional)','design.customBodyFont',d.customBodyFont||'')+input('Custom heading font (optional)','design.customHeadingFont',d.customHeadingFont||'')+'</div><div class="edit-card"><h3>SIZE & LAYOUT</h3>'+rangeField('Base text size','design.baseSize',d.baseSize,12,22,1,'px')+rangeField('Heading scale','design.headingScale',d.headingScale,.75,1.35,.05,'x')+rangeField('Heading letter spacing','design.headingTracking',d.headingTracking,-10,0,1,'px')+rangeField('Max width','design.maxWidth',d.maxWidth,700,1400,10,'px')+rangeField('Section spacing','design.sectionPad',d.sectionPad,35,120,5,'px')+rangeField('Card radius','design.radius',d.radius,0,30,1,'px')+rangeField('Button radius','design.btnRadius',d.btnRadius,0,40,1,'px')+'</div>';c.innerHTML=h;c.querySelectorAll('[data-key]').forEach(el=>{el.oninput=()=>{setPath(data,el.dataset.key,el.value);save();applyDesign();render()}})}
function selectField(label,key,val,opts){return '<div class="field"><label>'+label+'</label><select data-key="'+key+'">'+opts.map(x=>'<option '+(x===val?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div>'}
function rangeField(label,key,val,min,max,step,unit){return '<div class="field"><label>'+label+' <span class="rangeValue" id="v_'+key.replaceAll('.','_')+'">'+val+unit+'</span></label><input data-key="'+key+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"></div>'}
function projectsEditor(){const c=document.getElementById('projectsPanel');c.innerHTML='<div class="notice">For video, paste a direct MP4 URL from your video host. Thumbnails can be chosen from your iPhone. Large video files are better hosted separately.</div><div id="projectCards"></div><button class="save" id="newProject">+ Add project</button>';const box=document.getElementById('projectCards');data.projects.forEach((p,i)=>{const card=document.createElement('div');card.className='edit-card';card.innerHTML='<h3>PROJECT '+String(i+1).padStart(2,'0')+'</h3>'+selectField('Category','cat',p.cat,['short','podcast','ads','ai'])+input('Title','title',p.title)+textarea('Description','desc',p.desc)+input('Direct video URL','video',p.video)+ '<label class="upload">Choose thumbnail from iPhone<input type="file" accept="image/*" style="display:none"></label><button class="save danger" style="margin-top:10px">Delete project</button>';card.querySelectorAll('[data-key]').forEach(el=>el.oninput=()=>{p[el.dataset.key]=el.value;save();render()});card.querySelector('input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{p.thumb=r.result;save();render();projectsEditor()};r.readAsDataURL(f)};card.querySelector('.danger').onclick=()=>{data.projects.splice(i,1);save();render();projectsEditor()};box.appendChild(card)});document.getElementById('newProject').onclick=()=>{data.projects.push({cat:'short',title:'New Project',desc:'Add your project description.',video:'',thumb:''});save();render();projectsEditor()}}
function setPath(obj,path,value){const parts=path.split('.');let cur=obj;for(let i=0;i<parts.length-1;i++)cur=cur[parts[i]];const last=parts[parts.length-1];if(Array.isArray(cur))cur[+last]=value;else cur[last]=value;if(path.startsWith('design.')&&['baseSize','maxWidth','sectionPad','radius','btnRadius','headingScale','headingTracking'].includes(last))cur[last]=Number(value)}
function openEditor(){document.getElementById('editor').style.display='block';contentEditor();designEditor();projectsEditor()}
document.getElementById('editOpen').onclick=e=>{e.preventDefault();openEditor()};document.getElementById('closeEditor').onclick=()=>document.getElementById('editor').style.display='none';document.querySelectorAll('.editor-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.editor-tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.panel).classList.add('active')});
function exportSite(){const clone=document.documentElement.cloneNode(true);const state=JSON.stringify(data).replaceAll('<','\\u003c');const marker='<script id=\"portfolio-state\">window.__PORTFOLIO_STATE__='+state+';<\\/script>';const out='<!doctype html>\n'+clone.outerHTML.replace('</head>',marker+'</head>');const blob=new Blob([out],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.brand||'portfolio').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-updated.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backupData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.brand||'portfolio').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreData(file){const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();render();contentEditor();designEditor();projectsEditor();alert('Backup restored.');}catch(e){alert('That backup could not be read.')}};r.readAsText(file)}
document.getElementById('exportBtn').onclick=exportSite;document.getElementById('backupBtn').onclick=backupData;document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=e=>{if(e.target.files[0])restoreData(e.target.files[0])};
// Allow exported file to use embedded state if present
if(window.__PORTFOLIO_STATE__){data=window.__PORTFOLIO_STATE__}
render();
</script>
</body></html>
